<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>LLD Practice Platform</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#1a1a1a}
  select,textarea,button,input{font-size:15px;width:100%;box-sizing:border-box;padding:8px;margin:6px 0}
  textarea{height:200px;font-family:monospace}
  button{cursor:pointer;width:auto;padding:8px 20px}
  .card{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}
  .score{font-size:28px;font-weight:bold}
  .dim{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:4px 0}
  .badge{padding:2px 8px;border-radius:4px;font-size:12px;background:#eee}
  h3{margin-bottom:4px}
</style>
</head>
<body>
<h1>LLD Practice Platform</h1>

<div class="card">
  <label>User ID</label>
  <input id="userId" value="learner-1"/>
  <label>Problem</label>
  <select id="problemSelect"></select>
  <div id="problemDesc" style="color:#555;font-size:14px"></div>
  <button onclick="startAttempt()">Start Attempt</button>
</div>

<div id="submitCard" class="card" style="display:none">
  <label>Your design (classes, responsibilities, key decisions, edge cases)</label>
  <textarea id="content" placeholder="e.g. class ParkingLot { ... } handles concurrent entry via a lock..."></textarea>
  <button onclick="submitAttempt()">Submit for Evaluation</button>
</div>

<div id="resultCard" class="card" style="display:none"></div>

<div class="card">
  <h3>Attempt History</h3>
  <button onclick="loadHistory()">Refresh History</button>
  <div id="history"></div>
</div>

<script>
const API = "http://localhost:8000";
let currentAttemptId = null;

async function loadProblems(){
  const res = await fetch(`${API}/problems`);
  const problems = await res.json();
  const sel = document.getElementById("problemSelect");
  sel.innerHTML = problems.map(p => `<option value="${p.id}" data-desc="${p.description.replace(/"/g,'&quot;')}">${p.title} (${p.difficulty})</option>`).join("");
  sel.onchange();
}
document.addEventListener("DOMContentLoaded", () => {
  loadProblems();
  document.getElementById("problemSelect").onchange = (e) => {
    const opt = e.target.selectedOptions ? e.target.selectedOptions[0] : e.target.options[e.target.selectedIndex];
    document.getElementById("problemDesc").innerText = opt ? opt.dataset.desc : "";
  };
});

async function startAttempt(){
  const problemId = document.getElementById("problemSelect").value;
  const userId = document.getElementById("userId").value;
  const res = await fetch(`${API}/attempts`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({user_id: userId, problem_id: parseInt(problemId)})});
  const attempt = await res.json();
  currentAttemptId = attempt.id;
  document.getElementById("submitCard").style.display = "block";
  document.getElementById("resultCard").style.display = "none";
}

async function submitAttempt(){
  const content = document.getElementById("content").value;
  const res = await fetch(`${API}/attempts/${currentAttemptId}/submit`, {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({content})});
  const attempt = await res.json();
  renderResult(attempt);
}

function renderResult(attempt){
  const card = document.getElementById("resultCard");
  card.style.display = "block";
  if (!attempt.result){
    card.innerHTML = `<b>Status: ${attempt.status}</b><br/>${attempt.error_message || "No result yet."}
      <br/><button onclick="retryAttempt(${attempt.id})">Retry Evaluation</button>`;
    return;
  }
  const r = attempt.result;
  const dims = Object.keys(r.dimension_scores).map(k =>
    `<div class="dim"><span>${k.replace(/_/g," ")}</span><span>${r.dimension_scores[k]}/5 — ${r.comments[k]||""}</span></div>`).join("");
  card.innerHTML = `<span class="score">${r.overall_score}/100</span>
    <span class="badge">${r.evaluated_by}</span>
    <div>Status: ${attempt.status}${attempt.error_message ? " — "+attempt.error_message : ""}</div>
    ${dims}
    ${attempt.status !== "COMPLETED" ? `<button onclick="retryAttempt(${attempt.id})">Retry LLM Evaluation</button>` : ""}`;
}

async function retryAttempt(id){
  const res = await fetch(`${API}/attempts/${id}/retry`, {method:"POST"});
  renderResult(await res.json());
}

async function loadHistory(){
  const userId = document.getElementById("userId").value;
  const res = await fetch(`${API}/users/${userId}/history`);
  const attempts = await res.json();
  document.getElementById("history").innerHTML = attempts.map(a =>
    `<div class="dim"><span>Attempt #${a.id} — Problem ${a.problem_id} — ${a.status}</span>
     <span>${a.result ? a.result.overall_score+"/100" : "-"}</span></div>`).join("") || "No attempts yet.";
}
</script>
</body>
</html>
